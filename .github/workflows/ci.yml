name: Frontend and FastAPI checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements-lock.txt
      - run: backend/.venv/bin/python -m pytest backend/tests -q
      - run: npm run eval
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Start isolated combined preview
        run: |
          npm run dev:demo > /tmp/mirova-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3001/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mirova-preview.log
          exit 1
      - run: npm run test:frontend
        env:
          FRONTEND_TEST_URL: http://localhost:3001
      - run: npm run test:workflow
